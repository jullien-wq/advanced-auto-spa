<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif}a{color:#0D0F10}a:hover{color:#E31B23}</style>
</helmet>
<div style="font-family:Inter,sans-serif">
  <div style="background:#0D0F10;color:#D6D9DB;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:9px 24px;border-bottom:1px solid #26292B">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px">
      <a href="Contact.dc.html" style="color:#D6D9DB;text-decoration:none;display:flex;align-items:center;gap:6px"><span aria-hidden="true" style="color:#E31B23">◆</span>221 Park Avenue, Manalapan, NJ 07726</a>
      <span data-verify-hidden="true" style="display:flex;align-items:center;gap:6px;display:none">Hours: <span style="display:inline-flex;padding:1px 7px;border:1px dashed #E3A94F;background:rgba(227,169,79,.12);color:#E3A94F;font:600 10px/1.7 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;display:none" data-verify-hidden="true">Verify hours</span></span>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px">
      <a href="Reviews.dc.html" style="color:#fff;text-decoration:none;display:flex;align-items:center;gap:7px"><span style="color:#FBBC05;letter-spacing:1px" aria-hidden="true">★★★★★</span><span>5-Star Google Reviews</span><span style="display:inline-flex;padding:1px 7px;border:1px dashed #E3A94F;background:rgba(227,169,79,.12);color:#E3A94F;font:600 10px/1.7 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;display:none" data-verify-hidden="true">Verify count</span></a>
      <a href="tel:+17324411400" onClick="{{ trackCall }}" style="color:#fff;text-decoration:none;font-weight:600">(732) 441-1400</a>
    </div>
  </div>
  <nav aria-label="Main" style="position:sticky;top:0;z-index:60;background:#131516;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;border-bottom:1px solid #26292B">
    <a href="Home.dc.html" aria-label="Advanced Auto Spa home" style="display:flex;flex-direction:column;padding:14px 0;text-decoration:none">
      <span style="font:800 21px Manrope,sans-serif;letter-spacing:.14em;color:#fff">ADVANCED</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="height:2px;flex:1;background:#E31B23"></span><span style="font:700 10px Manrope,sans-serif;letter-spacing:.3em;color:#E31B23">AUTO SPA</span></span>
      <span style="font:500 8px Manrope,sans-serif;letter-spacing:.42em;color:#8B9093;margin-top:2px">OWNER OPERATED</span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:6px">
        <div style="position:relative">
          <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-haspopup="true" style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:24px 14px;font:600 13px Inter,sans-serif;letter-spacing:.12em;color:#F4F3EF" style-hover="color:#E31B23">SERVICES <span aria-hidden="true" style="font-size:9px">▼</span></button>
          <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:fixed;top:auto;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);background:#fff;border:1px solid #D8D8D4;box-shadow:0 24px 60px rgba(13,15,16,.28);display:grid;grid-template-columns:repeat(3,minmax(180px,220px));overflow:auto;z-index:70">
              <sc-for list="{{ menuCols }}" as="col" hint-placeholder-count="3">
                <div style="padding:22px 22px 26px;border-right:1px solid #EDEDEA">
                  <p style="margin:0 0 4px;font:800 12px Manrope,sans-serif;letter-spacing:.2em;color:#E31B23">{{ col.name }}</p>
                  <p style="margin:0 0 14px;font-size:12px;color:#6B7075">{{ col.tag }}</p>
                  <div style="display:flex;flex-direction:column;gap:9px">
                    <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="4">
                      <a href="{{ l.href }}" style="font-size:13.5px;font-weight:500;color:#191C1E;text-decoration:none" style-hover="color:#E31B23">{{ l.label }}</a>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a href="Results.dc.html" style="padding:24px 14px;font:600 13px Inter,sans-serif;letter-spacing:.12em;color:#F4F3EF;text-decoration:none" style-hover="color:#E31B23">RESULTS</a>
        <a href="Reviews.dc.html" style="padding:24px 14px;font:600 13px Inter,sans-serif;letter-spacing:.12em;color:#F4F3EF;text-decoration:none" style-hover="color:#E31B23">REVIEWS</a>
        <a href="About.dc.html" style="padding:24px 14px;font:600 13px Inter,sans-serif;letter-spacing:.12em;color:#F4F3EF;text-decoration:none" style-hover="color:#E31B23">ABOUT</a>
        <a href="Contact.dc.html" style="padding:24px 14px;font:600 13px Inter,sans-serif;letter-spacing:.12em;color:#F4F3EF;text-decoration:none" style-hover="color:#E31B23">CONTACT</a>
        <a href="Contact.dc.html#book" style="margin-left:10px;background:#E31B23;color:#fff;font:700 13px Inter,sans-serif;letter-spacing:.1em;padding:13px 26px;text-decoration:none" style-hover="background:#C4121A;color:#fff">BOOK NOW</a>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMobileNav }}" aria-expanded="{{ mobileNavOpen }}" aria-label="Menu" style="background:none;border:1px solid #3A3E42;color:#F4F3EF;font:600 12px Inter,sans-serif;letter-spacing:.12em;padding:10px 14px;cursor:pointer">MENU</button>
    </sc-if>
  </nav>
  <sc-if value="{{ mobileNavOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:#131516;border-bottom:1px solid #26292B;padding:18px 24px 90px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ mobileLinks }}" as="m" hint-placeholder-count="6">
        <a href="{{ m.href }}" style="color:#F4F3EF;text-decoration:none;font:600 15px Inter,sans-serif;letter-spacing:.08em;padding:12px 0;border-bottom:1px solid #26292B">{{ m.label }}</a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:80;display:grid;grid-template-columns:1fr 1.2fr 1fr;background:#E31B23">
      <a href="tel:+17324411400" style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;text-decoration:none;padding:12px 4px;font:700 12px Inter,sans-serif;letter-spacing:.08em;border-right:1px solid rgba(255,255,255,.25)"><span aria-hidden="true">✆</span>CALL</a>
      <a href="Contact.dc.html#book" style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;text-decoration:none;padding:12px 4px;font:700 12px Inter,sans-serif;letter-spacing:.08em;background:#C4121A">＋ BOOK NOW</a>
      <a href="Contact.dc.html#location" style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;text-decoration:none;padding:12px 4px;font:700 12px Inter,sans-serif;letter-spacing:.08em;border-left:1px solid rgba(255,255,255,.25)"><span aria-hidden="true">➤</span>DIRECTIONS</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false, mobileNavOpen: false, w: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  componentDidMount() {
    this._onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._onR);
    this._onDoc = (e) => { if (this.state.menuOpen && !e.target.closest('nav')) this.setState({ menuOpen: false }); };
    document.addEventListener('click', this._onDoc);
    this._onKey = (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false, mobileNavOpen: false }); };
    document.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onR);
    document.removeEventListener('click', this._onDoc);
    document.removeEventListener('keydown', this._onKey);
  }
  renderVals() {
    const isMobile = this.state.w < 900;
    const svc = (a) => 'Services.dc.html#' + a;
    return {
      isMobile, isDesktop: !isMobile,
      menuOpen: this.state.menuOpen, mobileNavOpen: this.state.mobileNavOpen,
      toggleMenu: (e) => { e.stopPropagation(); this.setState(s => ({ menuOpen: !s.menuOpen })); },
      toggleMobileNav: () => this.setState(s => ({ mobileNavOpen: !s.mobileNavOpen })),
      trackCall: () => {},
      menuCols: [
        { name: 'MAINTAIN', tag: 'Regular care', links: [
          { label: 'Premium Hand Wash', href: svc('hand-wash') },
          { label: 'Maintenance Detail', href: svc('maintenance-detail') },
          { label: 'Exterior Detail', href: svc('exterior-detail') },
          { label: 'Engine Detailing', href: svc('engine-detailing') }]},
        { name: 'RESTORE', tag: 'Bring it back', links: [
          { label: 'Full Detail', href: svc('full-detail') },
          { label: 'Interior Detail', href: 'Interior-Detail.dc.html' },
          { label: 'Interior Odor Elimination', href: svc('odor-elimination') },
          { label: 'Paint Correction', href: svc('paint-correction') },
          { label: 'Headlight Restoration', href: svc('headlight-restoration') },
          { label: 'Windshield Rock Chip Repair', href: svc('rock-chip-repair') }]},
        { name: 'PROTECT', tag: 'Long-term protection', links: [
          { label: 'Ceramic Coating', href: 'Ceramic-Coating.dc.html' },
          { label: 'Glass, Trim or Interior Coating', href: svc('glass-trim-interior') },
          { label: 'Window Tinting', href: svc('window-tinting') }]}
      ],
      mobileLinks: [
        { label: 'SERVICES', href: 'Services.dc.html' },
        { label: 'RESULTS', href: 'Results.dc.html' },
        { label: 'REVIEWS', href: 'Reviews.dc.html' },
        { label: 'ABOUT', href: 'About.dc.html' },
        { label: 'CONTACT', href: 'Contact.dc.html' },
        { label: 'BOOK NOW', href: 'Contact.dc.html#book' }
      ]
    };
  }
}
</script>
</body>
</html>
